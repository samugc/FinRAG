[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrag"
version = "0.1.0"
description = "Local RAG experiments for financial document question answering"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scikit-learn",
    "pypdf",
    "sentence-transformers",
    "transformers",
    "torch",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
finrag = "finrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
